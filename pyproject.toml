[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade (modern python syntax)
    "B",     # flake8-bugbear
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]
"backend/scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow or requiring full model loading (deselect with '-m \"not slow\"')",
    "integration: integration tests against API endpoints or simulated connections",
    "unit: fast in-memory unit tests",
]
